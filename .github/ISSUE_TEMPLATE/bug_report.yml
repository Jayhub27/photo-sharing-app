name: Bug report
description: Something is broken or does not behave as documented
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include enough detail that someone else can reproduce it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what actually happened?
      placeholder: I opened a paid collection, clicked Buy, and ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a collection
        2. Set a price
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, Docker image tag, or git commit SHA
      placeholder: v0.2.0
    validations:
      required: true
  - type: dropdown
    id: run-mode
    attributes:
      label: How are you running it?
      options:
        - Docker (docker compose up)
        - Local checkout (npm run server)
        - Deployed (Vercel, VPS, other)
        - Expo app
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: iPhone 15 Safari, Chrome 130 on Android
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Server console output, browser console errors, or screenshots
      render: shell
    validations:
      required: false
