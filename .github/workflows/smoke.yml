name: Smoke

# Runs against a deployed URL, never a local server. Vercel reports a
# deployment_status event for every preview and production build; this turns
# each one into a pass/fail signal on the commit that produced it.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: URL to smoke test
        required: true
        default: https://take-the-shot-api.vercel.app

concurrency:
  group: smoke-${{ github.event.deployment_status.environment || inputs.url }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  production:
    name: Production smoke
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium

      - name: Resolve deployment URL
        run: |
          URL="${{ inputs.url || github.event.deployment_status.environment_url }}"
          if [ -z "$URL" ]; then URL="${{ github.event.deployment_status.target_url }}"; fi
          echo "SHIP_URL=$URL" >> "$GITHUB_ENV"
          echo "Smoke testing $URL"

      - name: Verify production
        run: npm run verify

      - name: Browser smoke
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  incident:
    name: Open incident
    needs: production
    if: failure() && github.event_name == 'deployment_status'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open or update the incident issue
        run: |
          SHA="${{ github.event.deployment.sha }}"
          TITLE="Production smoke failed at ${SHA:0:7}"
          BODY="Deployment: ${{ github.event.deployment_status.environment_url }}
          Commit: $SHA
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

  auto-rollback:
    name: Auto rollback
    needs: production
    # Only roll back the commit that main points at. A rollback itself produces
    # a deployment of an older commit, so it can never trigger another one.
    if: >-
      failure() && github.event_name == 'deployment_status' &&
      github.event.deployment_status.environment == 'Production' &&
      github.event.deployment.sha == github.sha
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Dispatch rollback and re-verify
        run: |
          # Never flap: if a rollback ran in the last 30 minutes, leave it alone.
          LAST=$(gh run list --workflow=rollback.yml --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          if [ -n "$LAST" ]; then
            AGE=$(( $(date +%s) - $(date -d "$LAST" +%s) ))
            if [ "$AGE" -lt 1800 ]; then
              echo "A rollback ran ${AGE}s ago; not dispatching another one."
              exit 0
            fi
          fi
          gh workflow run rollback.yml -f verify=true

  preview:
    name: Preview smoke
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment_status.environment != 'Production'
    runs-on: ubuntu-latest
    # Preview deployments currently ship without the Supabase/Stripe env vars,
    # so keep this signal visible without blocking the PR. Remove the
    # continue-on-error line once Preview env vars exist in the Vercel project.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve preview URL
        run: |
          URL="${{ github.event.deployment_status.environment_url }}"
          if [ -z "$URL" ]; then URL="${{ github.event.deployment_status.target_url }}"; fi
          echo "SHIP_URL=$URL" >> "$GITHUB_ENV"

      - name: Verify preview
        run: node scripts/verify.mjs

  rollback-note:
    name: Rollback reference
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Deployment failed. Roll back with:"
          echo "  gh workflow run rollback.yml -f deployment=<previous-deployment-url>"
          echo "Or run: npx vercel rollback --yes"
