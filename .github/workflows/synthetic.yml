name: Synthetic check

# Every 15 minutes: is production healthy? Fails loudly and pings Discord when
# a secret is configured. GitHub Actions cron is best-effort; treat a skipped
# run as unknown, not as healthy.

on:
  schedule:
    # Off the quarter-hour, where GitHub's scheduler is busiest.
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:

concurrency:
  group: synthetic-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      SHIP_URL: https://take-the-shot-api.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Health endpoint
        id: health
        run: |
          curl -fsS "$SHIP_URL/api/health" -o health.json
          cat health.json
          node -e "const h=require('./health.json'); if(!h.ok) process.exit(1); console.log('version', h.version, 'commit', h.commit)"

      - name: Live verification
        id: verify
        run: node scripts/verify.mjs

      - name: Open or update the incident issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="Production synthetic check failing"
          BODY="The 15-minute check failed against $SHIP_URL.
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Close the incident when healthy
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue list --state open --search "Production synthetic check failing in:title" --json number --jq '.[].number' | while read -r n; do
            [ -n "$n" ] && gh issue close "$n" --comment "Resolved by a green run: $SHIP_URL"
          done

      - name: Alert Discord
        if: failure() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS -H 'Content-Type: application/json' \
            -d "{\"content\":\"Production synthetic check failed: $RUN_URL\"}" \
            "$DISCORD_WEBHOOK"
