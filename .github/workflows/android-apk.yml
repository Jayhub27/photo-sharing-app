name: Build Android APK

# Manual runs: Actions -> "Build Android APK" -> Run workflow.
# Tagged runs: push a tag like v0.3.0 and the APK is attached to that release,
# which is exactly what the website's DOWNLOAD APK button points at.
#
# With the ANDROID_KEYSTORE_BASE64 secret set, this produces a signed release
# build split per CPU ABI (arm64 is published). Without it, it falls back to a
# debug APK so the workflow still works in forks.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to create/attach the APK to (e.g. v0.3.0). Empty = artifact only.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Generate native Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

      - name: Configure release signing
        working-directory: app
        run: node scripts/configure-android-signing.mjs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Build APK
        working-directory: app/android
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi
        env:
          CI: '1'
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Collect APKs
        run: |
          OUT=app/android/app/build/outputs/apk
          if [ -f "$OUT/release/app-arm64-v8a-release.apk" ]; then
            cp "$OUT/release/app-arm64-v8a-release.apk" take-the-shot-android.apk
            echo "Publishing arm64-v8a release build"
          elif [ -f "$OUT/release/app-release.apk" ]; then
            cp "$OUT/release/app-release.apk" take-the-shot-android.apk
            echo "Publishing universal release build"
          else
            cp "$OUT/debug/app-debug.apk" take-the-shot-android.apk
            echo "Publishing debug build"
          fi
          mkdir -p apk-splits
          cp "$OUT"/release/*.apk apk-splits/ 2>/dev/null || cp "$OUT"/debug/*.apk apk-splits/
          ls -la take-the-shot-android.apk apk-splits

      - uses: actions/upload-artifact@v7
        with:
          name: take-the-shot-android-apk
          path: take-the-shot-android.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: take-the-shot-android-apk-splits
          path: apk-splits
          if-no-files-found: ignore

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Take the shot ${{ inputs.release_tag || github.ref_name }}
          files: take-the-shot-android.apk
          fail_on_unmatched_files: true
