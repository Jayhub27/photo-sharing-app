<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05010f">
<title>Offline · Take the shot</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100dvh;display:flex;align-items:center;justify-content:center;background-color:#05010f;background-image:linear-gradient(rgba(0,240,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,43,214,.06) 1px,transparent 1px),radial-gradient(ellipse at 50% -10%,rgba(157,75,255,.3),transparent 55%);background-size:46px 46px,46px 46px,100% 130%;color:#e8f6ff;font-family:'Share Tech Mono',ui-monospace,Menlo,monospace;padding:24px;text-align:center}
  .card{max-width:360px}
  .icon{width:72px;height:72px;border-radius:6px;background:linear-gradient(135deg,#00f0ff,#9d4bff 50%,#ff2bd6);display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 20px;box-shadow:0 0 12px rgba(0,240,255,.6),0 0 34px rgba(255,43,214,.3)}
  h1{font-family:'Orbitron','Arial Black',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:20px;margin-bottom:10px;text-shadow:0 0 12px rgba(0,240,255,.4)}
  p{color:#9fb3d0;font-size:15px;line-height:1.6;margin-bottom:22px}
  a{display:inline-flex;align-items:center;justify-content:center;background:rgba(0,240,255,.07);color:#00f0ff;border:1px solid rgba(0,240,255,.55);text-decoration:none;font-family:'Orbitron','Arial Black',sans-serif;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 0 8px rgba(0,240,255,.55);box-shadow:0 0 12px rgba(0,240,255,.18),inset 0 0 14px rgba(0,240,255,.08);padding:14px 24px;border-radius:4px;min-height:48px}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📷</div>
    <h1>You are offline</h1>
    <p>Take the shot needs a connection to load your collections and upload photos. Check your network and try again.</p>
    <a href="/">Try again</a>
  </div>
</body>
</html>
