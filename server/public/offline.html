<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ec">
<title>Offline · Take the shot</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#f7f4ec;color:#111;font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-weight:500;padding:24px;text-align:center}
  .card{max-width:380px;background:#fff;border:3px solid #111;box-shadow:8px 8px 0 #111;padding:28px}
  .icon{width:72px;height:72px;background:#ffd43b;border:2px solid #111;box-shadow:4px 4px 0 #111;display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 22px}
  h1{font-size:24px;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;margin-bottom:10px}
  p{color:#5a564d;font-size:16px;line-height:1.5;margin-bottom:22px}
  a{display:inline-flex;align-items:center;justify-content:center;background:#ffd43b;color:#111;text-decoration:none;font-weight:900;font-size:15px;text-transform:uppercase;letter-spacing:.03em;border:2px solid #111;box-shadow:4px 4px 0 #111;padding:14px 24px;min-height:50px}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📷</div>
    <h1>You are offline</h1>
    <p>Take the shot needs a connection to load your collections and upload photos. Check your network and try again.</p>
    <a href="/">Try again</a>
  </div>
</body>
</html>
