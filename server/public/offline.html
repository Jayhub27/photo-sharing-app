<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Offline · Take the shot</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#0a0a0f;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;padding:24px;text-align:center}
  .card{max-width:360px}
  .icon{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#6366f1,#a855f7 50%,#ec4899);display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 20px}
  h1{font-size:22px;margin-bottom:8px}
  p{color:#94a3b8;font-size:15px;line-height:1.6;margin-bottom:22px}
  a{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6366f1,#a855f7 50%,#ec4899);color:#fff;text-decoration:none;font-weight:600;padding:14px 24px;border-radius:14px;min-height:48px}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📷</div>
    <h1>You are offline</h1>
    <p>Take the shot needs a connection to load your collections and upload photos. Check your network and try again.</p>
    <a href="/">Try again</a>
  </div>
</body>
</html>
