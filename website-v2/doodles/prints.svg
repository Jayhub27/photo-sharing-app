    <path d="M84 119 C 110 115, 140 115, 164 119" stroke-width="1.6" opacity="0.5"/>
    <!-- caption squiggle -->
    <path d="M96 126 C 112 124, 128 124, 148 125" stroke-width="1.8" opacity="0.4"/>
  </g>
</svg>
