    <!-- back print -->
    <path d="M34 32 C 62 26, 100 24, 126 28 L 133 120 C 106 126, 66 128, 41 124 Z" fill="#fffdf7" stroke-width="2.6" opacity="0.85"/>
    <path d="M44 42 C 70 37, 100 36, 122 39 L 124 64 C 100 61, 70 62, 46 67 Z" fill="rgba(47,111,181,0.16)" stroke="none"/>
    <!-- middle print -->
