<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 160" width="190" height="160" role="img" aria-hidden="true">
  <!-- A framed print on a nail, drawn with a pencil: sky, sun and two hills. -->
  <g fill="none" stroke="#2f2a25" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- nail and strings -->
    <circle cx="95" cy="10" r="3.2" fill="#2f2a25" stroke="none"/>
    <path d="M95 13 C 78 22, 60 31, 44 39" stroke-width="1.8" opacity="0.65"/>
    <path d="M95 13 C 112 22, 132 31, 150 39" stroke-width="1.8" opacity="0.65"/>

    <!-- frame -->
    <path d="M27 42 C 68 36, 126 36, 164 42 C 168 46, 169 110, 164 122 C 120 129, 66 129, 28 122 C 23 116, 22 49, 27 42 Z" fill="#fffdf7" stroke-width="3"/>
    <!-- mat -->
    <path d="M42 55 C 80 50, 118 50, 152 55 C 155 59, 155 99, 152 111 C 116 117, 76 117, 42 111 C 39 105, 39 61, 42 55 Z" stroke-width="2.4"/>

    <!-- sky wash -->
    <path d="M44 58 C 80 53, 118 53, 150 58 L 150 84 C 116 80, 78 80, 44 84 Z" fill="rgba(47,111,181,0.18)" stroke="none"/>
    <!-- sun -->
    <circle cx="130" cy="70" r="9" fill="rgba(192,138,30,0.45)" stroke-width="2.2"/>
    <!-- hills -->
    <path d="M44 108 C 62 86, 76 86, 94 108 Z" fill="rgba(63,125,79,0.26)" stroke-width="2.4"/>
    <path d="M86 108 C 104 90, 126 90, 150 108 Z" fill="rgba(111,79,168,0.20)" stroke-width="2.4"/>
    <!-- ground line -->
    <path d="M44 108 C 80 104, 118 104, 150 108" stroke-width="1.8" opacity="0.5"/>
    <!-- a couple of pencil ticks for texture -->
    <g stroke-width="1.6" opacity="0.3">
      <path d="M56 96 L 62 92"/>
      <path d="M112 78 L 118 74"/>
    </g>
  </g>
</svg>
